name: Build FerFit APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ferfit_flutter/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch packages
        working-directory: ferfit_flutter
        run: flutter pub get

      - name: Build release APK
        working-directory: ferfit_flutter
        run: >
          flutter build apk --release
          --dart-define=FERFIT_API_URL=https://ferfit-apk.vercel.app/api/mobile

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FerFit-release
          path: ferfit_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
